<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lewis Builder · SubMed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
.lb-shell{width:min(1160px,calc(100% - 32px));margin:0 auto;padding:112px 0 54px;color:var(--ink)}
.lb-hero{margin-bottom:22px}.lb-kicker{font:700 .67rem var(--mono);letter-spacing:.1em;color:var(--blue-deep)}.lb-hero h1{font:800 clamp(2rem,4vw,3rem)/1.15 var(--font-display);letter-spacing:-.04em;margin:10px 0}.lb-hero h1 span{color:var(--blue)}.lb-hero p{color:var(--ink-2);max-width:700px;line-height:1.7}
.lb-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}.lb-main,.lb-panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.lb-main{padding:17px;min-width:0}.lb-panel{padding:18px;position:sticky;top:92px}
.lb-task{padding:15px;border:1px solid #cbdcff;background:var(--blue-tint-2);border-radius:13px;margin-bottom:14px}.lb-task small{font:700 .62rem var(--mono);letter-spacing:.09em;color:var(--blue-deep)}.lb-task h2{font:800 1.25rem var(--font-display);margin:6px 0}.lb-task p{font-size:.75rem;color:var(--ink-2);margin:0}.lb-toolbar{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:13px}.lb-group{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding-right:10px;margin-right:3px;border-right:1px solid var(--line)}.lb-group:last-child{border:0}.lb-group label{font:700 .58rem var(--mono);color:var(--ink-3);margin:0 4px}.lb-tool{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;font:700 .7rem var(--font);color:var(--ink-2);cursor:pointer}.lb-tool.active{background:var(--blue);color:white;border-color:var(--blue)}.lb-tool:hover{border-color:var(--blue)}
.lb-canvas-wrap{border:1px solid var(--line);border-radius:13px;background:#fff;padding:6px;overflow:hidden}#lewisCanvas{display:block;width:100%;height:auto;min-height:300px;touch-action:none;cursor:crosshair}.lb-canvas-note{font-size:.65rem;color:var(--ink-3);padding:8px 3px 0}
.lb-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.lb-btn{border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:800 .73rem var(--font);cursor:pointer;background:var(--surface-2);color:var(--ink-2)}.lb-btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.lb-btn:disabled{opacity:.45;cursor:not-allowed}
.lb-panel h3{font:800 .9rem var(--font-display);margin:0 0 12px}.lb-field{display:grid;gap:6px;margin-bottom:13px}.lb-field label{font-size:.68rem;font-weight:800;color:var(--ink-2)}.lb-field select{border:1px solid var(--line-2);border-radius:9px;padding:10px;background:var(--surface-2);color:var(--ink);font:600 .75rem var(--font);width:100%}.lb-hint{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:.7rem;line-height:1.65;color:var(--ink-2)}.lb-result{margin-top:13px;border-radius:11px;padding:12px;font-size:.75rem;line-height:1.6;display:none}.lb-result.ok{display:block;background:#eaf8f1;color:#116b48;border:1px solid #bce8d2}.lb-result.no{display:block;background:#fff1f1;color:#9e2929;border:1px solid #f3caca}.lb-key{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.lb-key span{font:700 .64rem var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
@media(max-width:900px){.lb-grid{grid-template-columns:1fr}.lb-panel{position:static}.lb-main{padding:12px}}@media(max-width:560px){.lb-shell{width:calc(100% - 22px);padding-top:94px}.lb-toolbar{gap:6px}.lb-group{border:0;padding:0}.lb-tool{padding:7px 8px;font-size:.65rem}#lewisCanvas{min-height:230px}.lb-controls .lb-btn{flex:1}}
</style>
<script type="module" src="assets/js/guard.js"></script>
</head>
<body data-nav="full">
<main class="lb-shell">
<header class="lb-hero"><h1>Lewis Builder</h1></header>
<div class="lb-grid">
<section class="lb-main">
<div class="lb-task"><small>COMPUSUL DE CONSTRUIT</small><h2 id="taskName">Se încarcă…</h2><p id="taskMeta"></p></div>
<div class="lb-toolbar">
<div class="lb-group"><label>ACȚIUNE</label><button class="lb-tool active" data-tool="atom">Atom</button><button class="lb-tool" data-tool="bond">Legătură</button><button class="lb-tool" data-tool="lone">Perechi</button><button class="lb-tool" data-tool="delete">Șterge</button><button class="lb-tool" data-tool="charge">Sarcină</button></div>
<div class="lb-group"><label>ELEMENT</label><span id="elementTools"></span></div>
<div class="lb-group"><label>ORDIN</label><button class="lb-tool active" data-order="1">Simplă</button><button class="lb-tool" data-order="2">Dublă</button><button class="lb-tool" data-order="3">Triplă</button></div><div class="lb-group"><label>SARCINĂ</label><button class="lb-tool active" data-charge="0">0</button><button class="lb-tool" data-charge="1">+</button><button class="lb-tool" data-charge="-1">−</button></div>
</div>
<div class="lb-canvas-wrap"><svg id="lewisCanvas" viewBox="0 0 900 430" role="img" aria-label="Canvas pentru desenarea structurii Lewis"></svg></div>

<div class="lb-controls"><button class="lb-btn primary" id="validateBtn">✓ Verifică structura</button><button class="lb-btn" id="newTaskBtn">Alt compus ↻</button><button class="lb-btn" id="clearBtn">Golește canvasul</button></div>
<div id="result" class="lb-result" role="status" aria-live="polite"></div>
</section>
<aside class="lb-panel">
<h3>Setările exercițiului</h3>
<div class="lb-field"><label for="categorySelect">Clasa de compuși</label><select id="categorySelect"></select></div>
<div class="lb-field"><label for="difficultySelect">Dificultate</label><select id="difficultySelect"><option value="all">Toți compușii disponibili</option><option value="small">Molecule mici (max. 6 atomi grei)</option><option value="medium">Molecule medii (7–12 atomi grei)</option></select></div>

<div class="lb-key"><span>C — carbon</span><span>O — oxigen</span><span>N — azot</span><span>F / Cl / Br / I</span><span>S — sulf</span><span>P — fosfor</span><span>· · — pereche neparticipantă</span></div>
<div id="supportedCount" style="font-size:.67rem;color:var(--ink-3);margin-top:12px"></div>
</aside>
</div>
</main>
<script src="compounds.js?v=20261109-2"></script>
<script type="module" src="assets/js/components.js?v=20261109"></script>
<script src="assets/js/lewis-builder.js?v=20261109-2" defer></script>
</body></html>
