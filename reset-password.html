<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submed · Resetare parolă</title>
<meta name="description" content="Resetează-ți parola contului Submed.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>

<body data-nav="minimal">

<div class="auth-shell">
  <div class="auth-wrap">

    <div class="auth-heading">
      <h2 id="heading">Resetare parolă</h2>
      <p id="subheading">Îți trimitem un link de resetare pe email.</p>
    </div>

    <div class="auth-card">
      <div class="alert-banner" id="alertBanner"></div>

      <!-- Etapa 1: cerere link -->
      <form id="requestForm" novalidate>
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="student@exemplu.ro" autocomplete="email" required>
        </div>
        <button type="submit" class="btn-auth" id="requestBtn">
          <span class="btn-label">Trimite linkul</span>
          <div class="spinner"></div>
        </button>
      </form>

      <!-- Etapa 2: setare parolă nouă (apare după click pe linkul din email) -->
      <form id="updateForm" novalidate style="display:none">
        <div class="field-group">
          <label for="newPassword">Parolă nouă</label>
          <div class="pw-wrap">
            <input type="password" id="newPassword" placeholder="Minim 6 caractere" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Arată/ascunde parola">
              <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="updateBtn">
          <span class="btn-label">Salvează parola nouă</span>
          <div class="spinner"></div>
        </button>
      </form>
    </div>

    <div class="auth-alt"><a href="login.html">← Înapoi la autentificare</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/components.js?v=supabase-singleton-20261028"></script>
<script type="module">
import { Auth } from './assets/js/auth.js?v=supabase-singleton-20261028';
import { supabase } from './assets/js/supabase-client.js';

const $ = id => document.getElementById(id);
const banner = $('alertBanner');
function showAlert(msg, type='error') { banner.textContent = msg; banner.className = `alert-banner show ${type}`; }
function hideAlert() { banner.className = 'alert-banner'; }
function setLoading(form, on) {
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = on;
  btn.querySelector('.btn-label').style.display = on ? 'none' : 'inline';
  btn.querySelector('.spinner').style.display   = on ? 'block' : 'none';
}

/* Dacă userul vine de pe linkul din email, Supabase emite evenimentul
   PASSWORD_RECOVERY → trecem la etapa 2 (setare parolă nouă). */
supabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    $('heading').textContent = 'Setează parola nouă';
    $('subheading').textContent = 'Alege o parolă nouă pentru contul tău.';
    $('requestForm').style.display = 'none';
    $('updateForm').style.display = 'block';
  }
});

/* Etapa 1 — trimite link */
$('requestForm').addEventListener('submit', async e => {
  e.preventDefault();
  hideAlert();
  const email = $('email').value.trim();
  if (!email) { showAlert('Introdu adresa de email.'); return; }
  setLoading($('requestForm'), true);
  try {
    await Auth.resetPassword(email);
    showAlert('Ți-am trimis un link de resetare pe email.', 'success');
  } catch (err) {
    showAlert(err.message || 'Nu am putut trimite linkul.');
  } finally { setLoading($('requestForm'), false); }
});

/* Etapa 2 — setează parola nouă */
$('updateForm').addEventListener('submit', async e => {
  e.preventDefault();
  hideAlert();
  const pw = $('newPassword').value;
  if (pw.length < 6) { showAlert('Parola trebuie să aibă minim 6 caractere.'); return; }
  setLoading($('updateForm'), true);
  try {
    await Auth.updatePassword(pw);
    showAlert('Parolă schimbată! Redirecționăm…', 'success');
    setTimeout(() => location.href = 'login.html', 1500);
  } catch (err) {
    showAlert(err.message || 'Nu am putut schimba parola.');
  } finally { setLoading($('updateForm'), false); }
});

/* password toggle */
$('pwToggle').addEventListener('click', () => {
  const inp = $('newPassword');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});
</script>
</body>
</html>
