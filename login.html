<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submed · Autentificare</title>
<meta name="description" content="Conectează-te la Submed pentru a accesa grile, simulări și scanarea foilor de grilă.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=auth-recovery-086b40d-20260929a">
</head>

<body data-nav="minimal">

<div class="auth-shell">
  <div class="auth-wrap">

    <div class="auth-heading">
      <h2>Bun venit înapoi 👋</h2>
      <p>Conectează-te pentru a-ți continua pregătirea.</p>
    </div>

    <div class="auth-card">
      <div class="alert-banner" id="alertBanner"></div>

      <a class="btn-google" href="#" id="googleBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuă cu Google
      </a>

      <div class="divider">sau</div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="student@exemplu.ro" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label for="password">Parolă</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" placeholder="Parola ta" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Arată/ascunde parola">
              <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="forgot-row"><a href="reset-password.html">Ai uitat parola?</a></div>
        <button type="submit" class="btn-auth" id="submitBtn">
          <span id="btnText">Intră în cont</span>
          <div class="spinner" id="btnSpinner"></div>
          <svg id="btnArrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>
    </div>

    <div class="auth-alt">Nu ai cont? <a href="register.html">Înregistrează-te</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/components.js?v=wall-second-brain-20261110"></script>
<script>
(function () {
  var shown = false;
  function showAuthLoadError(message) {
    if (shown) return;
    shown = true;
    var banner = document.getElementById('alertBanner');
    if (banner) {
      banner.textContent = message || 'Autentificarea nu s-a putut încărca. Verifică conexiunea și reîncarcă pagina.';
      banner.className = 'alert-banner show error';
    }
  }
  window.addEventListener('error', function (event) {
    if (event.target && event.target.id === 'authPageModule') {
      showAuthLoadError('Modulul de autentificare nu s-a putut descărca. Verifică conexiunea și reîncarcă pagina.');
    }
  }, true);
  window.addEventListener('unhandledrejection', function (event) {
    console.error('Eroare la inițializarea autentificării:', event.reason);
  });
  window.setTimeout(function () {
    if (document.documentElement.dataset.authPageReady !== 'true') {
      showAuthLoadError('Autentificarea nu a pornit. Reîncarcă pagina; dacă problema persistă, contactează suportul SubMed.');
    }
  }, 8000);
})();
</script>
<script type="module" id="authPageModule" src="assets/js/login-page.js?v=20261109"></script>
</body>
</html>
