<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Exersează nomenclatura compușilor organici pentru admiterea la medicină.">
<title>Quiz IUPAC · SubMed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/iupac-quiz.css?v=20261109">
<script type="module" src="assets/js/guard.js"></script>
</head>
<body data-nav="full">
<main class="iq-shell">
  <header class="iq-hero"><h1>Quiz IUPAC</h1></header>
  <div class="iq-layout">
    <aside class="iq-side">
      <div class="iq-side-top"><strong>Alege o clasă</strong><small id="categoryCount">— compuși</small></div>
      <div id="categoryGrid" class="iq-categories" role="group" aria-label="Clasa de compuși"></div>

    </aside>
    <section class="iq-workspace" aria-label="Exercițiu de nomenclatură">
      <div class="iq-toolbar">
        <div class="iq-toolbar-label"><span class="iq-live"></span><b id="activeCategory">Toate clasele</b><small id="compoundCount">— compuși</small></div>
        <button id="resetBtn" class="iq-small-btn" type="button">↺ Reîncepe</button>
      </div>
      <div class="iq-stats"><div><small>ÎNTREBAREA</small><strong><span id="currentNum">0</span> / <span id="totalCount">0</span></strong></div><div><small>CORECTE</small><strong id="score">0</strong></div><div><small>DE REVĂZUT</small><strong id="wrongCount">0</strong></div></div>
      <div class="iq-progress" aria-hidden="true"><span id="quizProgress"></span></div>
      <div class="iq-molecule">
        <div class="iq-molecule-head"><span>STRUCTURĂ MOLECULARĂ</span><span id="moleculeHint">Identifică denumirea</span></div>
        <div class="iq-canvas-area"><canvas id="moleculeCanvas" width="560" height="320" role="img" aria-label="Structura chimică de identificat"></canvas></div>

      </div>
      <form id="answerForm" class="iq-answer" novalidate>
        <label for="answerInput">Cum se numește acest compus?</label>

        <input id="answerInput" type="text" autocomplete="off" spellcheck="false" placeholder="Ex.: acid etanoic, acid acetic…" required>
        <div id="feedback" class="iq-feedback" role="status" aria-live="polite"></div>
        <div class="iq-actions">
          <button id="btnCheck" class="iq-primary" type="submit">Verifică răspunsul <span>→</span></button>
          <button id="btnNext" class="iq-secondary" type="button" disabled>Următorul compus <span>→</span></button>
        </div>
      </form>
      <div id="quizDone" class="iq-done" hidden>
        <div class="iq-done-icon">✓</div><h2>Sesiune încheiată!</h2>
        <p id="doneSummary"></p>
        <div class="iq-actions"><button id="retryWrongBtn" class="iq-primary" type="button">Repetă greșelile</button><button id="retryAllBtn" class="iq-secondary" type="button">Reia categoria</button></div>
      </div>
    </section>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/components.js?v=wall-quick-popup-20261110"></script>
<script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
<script src="compounds.js?v=20261109-2"></script>
<script src="assets/js/iupac-quiz.js?v=20261109" defer></script>
</body>
</html>
