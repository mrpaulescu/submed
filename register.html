<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submed · Înregistrare</title>
<meta name="description" content="Creează-ți cont pe Submed și începe pregătirea pentru admiterea la medicină.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>

<body data-nav="minimal">

<div class="auth-shell">
  <div class="auth-wrap">

    <div class="auth-heading">
      <h2>Creează-ți cont 🚀</h2>
      <p>Începe pregătirea în câteva secunde.</p>
    </div>

    <div class="auth-card">
      <div class="alert-banner" id="alertBanner"></div>

      <a class="btn-google" href="#" id="googleBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Înregistrare cu Google
      </a>

      <div class="divider">sau</div>

      <form id="registerForm" novalidate>
        <div class="field-group">
          <label for="name">Nume complet</label>
          <input type="text" id="name" name="name" placeholder="Ion Popescu" autocomplete="name" required>
        </div>
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="student@exemplu.ro" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label for="password">Parolă</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" placeholder="Minim 6 caractere" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Arată/ascunde parola">
              <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="submitBtn">
          <span id="btnText">Creează cont</span>
          <div class="spinner" id="btnSpinner"></div>
          <svg id="btnArrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>
    </div>

    <div class="auth-alt">Ai deja cont? <a href="login.html">Intră în cont</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/components.js?v=supabase-singleton-20261028"></script>
<script type="module">
import { Auth } from './assets/js/auth.js?v=supabase-singleton-20261028';

const $ = id => document.getElementById(id);
const banner = $('alertBanner');

/* dacă ești deja autentificat, sări direct la dashboard */
Auth.redirectIfLoggedIn();

function showAlert(msg, type='error') { banner.textContent = msg; banner.className = `alert-banner show ${type}`; }
function hideAlert() { banner.className = 'alert-banner'; }
function setLoading(on) {
  $('submitBtn').disabled = on;
  $('btnText').style.display   = on ? 'none' : 'inline';
  $('btnSpinner').style.display= on ? 'block' : 'none';
  $('btnArrow').style.display  = on ? 'none' : 'block';
}

let pwVisible = false;
$('pwToggle').addEventListener('click', () => {
  pwVisible = !pwVisible;
  $('password').type = pwVisible ? 'text' : 'password';
  $('eyeIcon').innerHTML = pwVisible
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

$('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  hideAlert();
  const name = $('name').value.trim(), email = $('email').value.trim(), password = $('password').value;
  if (!name || !email || !password) { showAlert('Completează toate câmpurile.'); return; }
  if (password.length < 6) { showAlert('Parola trebuie să aibă minim 6 caractere.'); return; }
  setLoading(true);
  try {
    const result = await Auth.register(name, email, password);
    if (result?.session) {
      showAlert('Cont creat! Te redirecționăm către contul tău.', 'success');
      setTimeout(() => location.href = Auth.getPostLoginRedirect(), 700);
    } else {
      showAlert('Cont creat! Verifică-ți emailul pentru confirmare.', 'success');
      setTimeout(() => location.href = 'login.html', 2000);
    }
  } catch (err) {
    showAlert(err.message || 'Nu am putut crea contul.');
  } finally { setLoading(false); }
});

$('googleBtn').addEventListener('click', async e => {
  e.preventDefault();
  try { await Auth.loginWithGoogle(); }
  catch (err) { showAlert('Google Sign-In indisponibil: ' + err.message); }
});

['name','email','password'].forEach(id =>
  $(id).addEventListener('input', function() { this.classList.remove('input-error'); hideAlert(); }));
</script>
</body>
</html>
